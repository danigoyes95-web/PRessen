<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/nocturne-d00f96ab-d6f9-428f-aa2b-155cea5b2668/styles.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&amp;family=DM+Sans:wght@400;600;800&amp;display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:#332d2d;color:#332d2d;font-family:"DM Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#332d2d}a:hover{color:#e5483f}
@keyframes wob{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(-4deg) translateY(-6px)}}
@keyframes spinp{to{transform:rotate(360deg)}}
@keyframes fall{0%{transform:translateY(-10vh) rotate(0)}100%{transform:translateY(110vh) rotate(720deg)}}
@keyframes pop{0%{transform:scale(.3) rotate(-8deg);opacity:0}70%{transform:scale(1.08) rotate(2deg);opacity:1}100%{transform:scale(1) rotate(-2deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes stripe{from{transform:scaleY(0)}to{transform:scaleY(1)}}
</style>
</helmet>
<div style="position:relative;min-height:100vh;overflow:hidden;isolation:isolate">
  <div aria-hidden="true" style="position:fixed;inset:0;z-index:-2;display:grid;grid-template-columns:repeat(8,1fr)">
    <sc-for list="{{ stripes }}" as="s" hint-placeholder-count="8">
      <div style="background:{{ s.c }};transform-origin:top;animation:{{ s.anim }}"></div>
    </sc-for>
  </div>
  {{ confetti }}
  <main style="max-width:560px;margin:0 auto;padding:clamp(28px,6vw,56px) 18px 64px;display:flex;flex-direction:column;align-items:center;gap:28px">
    <div style="position:relative;width:min(78vw,320px);aspect-ratio:1;margin-top:clamp(150px,30vw,190px);animation:{{ bobA }}">
      <div style="position:absolute;inset:-14%;animation:{{ spinA }}">
        <sc-for list="{{ petals }}" as="p" hint-placeholder-count="12">
          <div style="position:absolute;left:50%;top:50%;width:30%;height:30%;margin:-15% 0 0 -15%;border-radius:50%;background:{{ p.c }};border:4px solid #332d2d;transform:{{ p.tf }}"></div>
        </sc-for>
      </div>
      <div style="position:absolute;inset:0;border-radius:50%;border:6px solid #332d2d;overflow:hidden;background:#ffe100;box-shadow:0 0 0 8px #fff,0 0 0 13px #332d2d">
        <img src="cumple/cara.png" alt="El cumpleañero" style="width:100%;height:100%;object-fit:cover;object-position:50% 40%;display:block">
      </div>
      <div style="position:absolute;left:30%;top:-46%;width:44%;height:62%;transform-origin:50% 100%;animation:{{ hatA }}">
        <div style="position:absolute;inset:0;clip-path:polygon(50% 0,100% 100%,0 100%);background:repeating-linear-gradient(-35deg,#e86da6 0 16px,#ffe100 16px 32px,#0a85d0 32px 48px,#4cb36b 48px 64px);filter:drop-shadow(0 0 0 #332d2d)"></div>
        <div style="position:absolute;left:50%;top:-12%;width:30%;aspect-ratio:1;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#e5483f 55%);border:4px solid #332d2d"></div>
        <div style="position:absolute;left:-10%;right:-10%;bottom:-6%;height:16%;border-radius:999px;background:#fff;border:4px solid #332d2d"></div>
      </div>
    </div>
    <div style="text-align:center;display:flex;flex-direction:column;gap:8px;animation:{{ popA }}">
      <h1 style="margin:0;font-family:'Lilita One',sans-serif;font-weight:400;font-size:clamp(48px,13vw,92px);line-height:.92;color:#fff;-webkit-text-stroke:3px #332d2d;paint-order:stroke fill;text-shadow:5px 5px 0 #332d2d;text-wrap:balance">¡Hoy es mi cumple!</h1>
      <p style="margin:0 auto;padding:8px 18px;border-radius:999px;background:#332d2d;color:#ffe100;font-family:'Lilita One',sans-serif;font-size:clamp(22px,5.6vw,32px);line-height:1.1">y tú estás invitado</p>
    </div>
    <div style="width:100%;background:#fff;border:4px solid #332d2d;border-radius:28px;box-shadow:8px 8px 0 #332d2d;padding:clamp(20px,5vw,30px);display:flex;flex-direction:column;gap:22px">
      
      <div style="display:flex;flex-direction:column;gap:10px">
        <span style="font-weight:800;font-size:15px">¿Vienes?</span>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
          <button onClick="{{ yes }}" style="font-family:'Lilita One',sans-serif;font-size:22px;min-height:56px;border:3px solid #332d2d;border-radius:16px;cursor:pointer;background:{{ yesBg }};color:#332d2d;box-shadow:{{ yesSh }};transition:transform .12s" style-active="transform:translate(3px,3px)">¡Sí, voy! 🎉</button>
          <button onClick="{{ no }}" style="font-family:'Lilita One',sans-serif;font-size:22px;min-height:56px;border:3px solid #332d2d;border-radius:16px;cursor:pointer;background:{{ noBg }};color:{{ noFg }};box-shadow:{{ noSh }};transition:transform .12s" style-active="transform:translate(3px,3px)">No puedo</button>
        </div>
      </div>
      <sc-if value="{{ going }}" hint-placeholder-val="{{ true }}">
        <div style="display:flex;flex-direction:column;gap:10px">
          <span style="font-weight:800;font-size:15px">¿Qué traes para brindar?</span>
          <div style="display:flex;flex-wrap:wrap;gap:8px">
            <sc-for list="{{ drinks }}" as="d" hint-placeholder-count="7">
              <button onClick="{{ d.pick }}" style="font:inherit;font-weight:800;font-size:15px;min-height:44px;padding:0 16px;border:3px solid #332d2d;border-radius:999px;cursor:pointer;background:{{ d.bg }};color:{{ d.fg }}">{{ d.label }}</button>
            </sc-for>
          </div>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
          <span style="font-weight:800;font-size:15px">¿Vienes con amigos?</span>
          <div style="display:flex;align-items:center;gap:6px">
            <button onClick="{{ minus }}" aria-label="Menos" style="width:48px;height:48px;border:3px solid #332d2d;border-radius:14px;background:#fff;font-family:'Lilita One',sans-serif;font-size:26px;cursor:pointer;color:#332d2d">−</button>
            <span style="min-width:96px;text-align:center;font-family:'Lilita One',sans-serif;font-size:22px">{{ friendsTxt }}</span>
            <button onClick="{{ plus }}" aria-label="Más" style="width:48px;height:48px;border:3px solid #332d2d;border-radius:14px;background:#4cb36b;font-family:'Lilita One',sans-serif;font-size:26px;cursor:pointer;color:#fff">+</button>
          </div>
        </div>
      </sc-if>
      <a href="{{ waLink }}" target="_blank" style="display:flex;align-items:center;justify-content:center;min-height:62px;border:3px solid #332d2d;border-radius:18px;background:#4cb36b;color:#fff;text-decoration:none;font-family:'Lilita One',sans-serif;font-size:24px;box-shadow:5px 5px 0 #332d2d;-webkit-text-stroke:1px #332d2d;paint-order:stroke fill;transition:transform .12s" style-active="transform:translate(4px,4px)">Enviar por WhatsApp</a>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;animate&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { name: '', going: true, drink: null, friends: 0 };
  renderVals() {
    const { name, going, drink, friends } = this.state;
    const P = ['#f5f5f5', '#7f5fa8', '#0a85d0', '#4cb36b', '#ffe100', '#e86da6', '#e5483f', '#332d2d'];
    const off = this.props.animate === false;
    const a = v => off ? 'none' : v;
    const D = ['Cerveza', 'Ron', 'Vodka', 'Whisky', 'Tequila', 'Vino', 'Sorpresa'];
    const DC = ['#ffe100', '#e5483f', '#0a85d0', '#7f5fa8', '#4cb36b', '#e86da6', '#332d2d'];
    let msg = going
      ? `¡Hola! Soy ${name || '(sin nombre)'} y confirmo que SÍ voy a tu cumple 🎉\nLlevo: ${drink || 'por decidir'}\nAmigos extra: ${friends}`
      : `¡Hola! Soy ${name || '(sin nombre)'}. Esta vez no puedo ir a tu cumple, ¡pero feliz cumpleaños! 🎂`;
    if (!this._conf) {
      this._conf = React.createElement('div', { 'aria-hidden': true, style: { position: 'fixed', inset: 0, pointerEvents: 'none', zIndex: -1, overflow: 'hidden' } },
        Array.from({ length: 34 }, (_, i) => React.createElement('span', { key: i, style: {
          position: 'absolute', top: 0, left: (i * 37 % 100) + '%', width: 8 + (i % 3) * 4, height: i % 2 ? 8 : 16,
          borderRadius: i % 4 === 0 ? '50%' : 2, background: P[(i % 7) + (i % 7 === 0 ? 1 : 0)], border: '2px solid #332d2d',
          animation: off ? 'none' : `fall ${6 + (i % 5) * 1.6}s linear ${-(i * 0.7)}s infinite` } })));
    }
    return {
      stripes: P.map((c, i) => ({ c, anim: a(`stripe .7s cubic-bezier(.2,.8,.2,1) ${i * .07}s both`) })),
      petals: Array.from({ length: 12 }, (_, i) => ({ c: P[(i % 7) + 1 === 8 ? 0 : (i % 7) + 1], tf: `rotate(${i * 30}deg) translateY(-155%)` })),
      confetti: this._conf,
      spinA: a('spinp 24s linear infinite'), hatA: a('wob 2.4s ease-in-out infinite'),
      bobA: a('bob 3.2s ease-in-out infinite'), popA: a('pop .8s cubic-bezier(.2,.9,.3,1.3) .3s both'),
      name, onName: e => this.setState({ name: e.target.value }),
      going,
      yes: () => this.setState({ going: true }), no: () => this.setState({ going: false }),
      yesBg: going ? '#ffe100' : '#fff', yesSh: going ? '4px 4px 0 #332d2d' : 'none',
      noBg: going ? '#fff' : '#332d2d', noFg: going ? '#332d2d' : '#fff', noSh: going ? 'none' : '4px 4px 0 #e5483f',
      drinks: D.map((d, i) => ({ label: d, pick: () => this.setState({ drink: d }), bg: drink === d ? DC[i] : '#fff', fg: drink === d && ['#7f5fa8', '#0a85d0', '#332d2d', '#e5483f', '#4cb36b'].includes(DC[i]) ? '#fff' : '#332d2d' })),
      minus: () => this.setState(s => ({ friends: Math.max(0, s.friends - 1) })),
      plus: () => this.setState(s => ({ friends: Math.min(10, s.friends + 1) })),
      friendsTxt: friends === 0 ? 'Solo yo' : '+' + friends,
      waLink: 'https://wa.me/593998475412?text=' + encodeURIComponent(msg)
    };
  }
}
</script>
</body>
</html>
